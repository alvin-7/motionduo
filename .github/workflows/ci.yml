name: CI

on:
  push:
    branches: [main, mygo]
  pull_request:
    branches: [main, mygo]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust + MyGo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v6
        with:
          go-version-file: mousehop-mygo/go.mod
          cache-dependency-path: mousehop-mygo/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libdbus-1-dev libgtk-3-dev fonts-dejavu-core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: 16 MiB in-memory clipboard release performance
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test --release -p mousehop --lib --all-features --locked clipboard_focus::tests::fake_sixteen_mib_release_performance -- --exact --nocapture
      - run: go -C mousehop-mygo test ./...
      - run: go -C mousehop-mygo vet ./...
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l mousehop-mygo)"
      - name: Windows paired build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-mygo.ps1
      - name: Windows application icon resources
        if: runner.os == 'Windows'
        run: |
          python scripts/verify-mygo-icons.py
          python scripts/verify-mygo-icons.py --binary target/debug/motionduo.exe
      - name: Unix paired build
        if: runner.os != 'Windows'
        run: sh scripts/build-mygo.sh
