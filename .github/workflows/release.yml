name: Release
run-name: Release - ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
          - { os: windows-latest, arch: x86_64 }
          - { os: macos-15-intel, arch: intel }
          - { os: macos-15, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: mousehop-mygo/go.mod
          cache-dependency-path: mousehop-mygo/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libdbus-1-dev libgtk-3-dev
      - name: Linux archive
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sh scripts/build-mygo.sh --release
          stage="mousehop-${TAG#v}-$ARCH"
          mkdir "$stage"
          cp target/release/motionduo target/release/motionduo-ui \
            mousehop/com.mousehop.Mousehop.desktop mousehop/assets/com.mousehop.Mousehop.svg \
            LICENSE NOTICE mousehop-mygo/THIRD_PARTY_NOTICES.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
      - name: Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          ./scripts/build-mygo.ps1 -Release
          New-Item -ItemType Directory -Path mousehop-windows | Out-Null
          Copy-Item target/release/motionduo.exe,target/release/motionduo-ui.exe,LICENSE,NOTICE,mousehop-mygo/THIRD_PARTY_NOTICES.md mousehop-windows
          Compress-Archive mousehop-windows/* mousehop-windows-x86_64.zip
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install imagemagick librsvg create-dmg
      - name: macOS bundle and DMG
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MOUSEHOP_SIGNING_PASSWORD: ${{ secrets.MOUSEHOP_SIGNING_PASSWORD }}
        run: |
          sh scripts/package-macos.sh
          app="target/release/bundle/osx/MotionDuo.app"
          dmg="mousehop-macos-$ARCH.dmg"
          bash scripts/sign-and-notarize.sh --app "$app"
          create-dmg --volname Mousehop --window-pos 200 120 --window-size 600 400 \
            --icon-size 96 --icon MotionDuo.app 150 200 --app-drop-link 450 200 \
            --no-internet-enable "$dmg" "$app"
          bash scripts/sign-and-notarize.sh --dmg "$dmg"
      - name: Upload Unix package
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(mousehop-*.tar.gz mousehop-*.dmg)
          test ${#files[@]} -gt 0
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload Windows package
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" mousehop-windows-x86_64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
